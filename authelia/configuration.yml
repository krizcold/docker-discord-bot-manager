# Authelia config for the Bot Manager remote-access gateway (used by
# docker-compose.remote.yml). Rendered with the Go-template filter
# (X_AUTHELIA_CONFIG_FILTERS=template), so hostnames come from env vars set in the
# compose - you do NOT edit this file; set PUBLIC_HOST / AUTHELIA_HOST /
# COOKIE_DOMAIN in .env instead. Secrets come from *_FILE env vars (see README) and
# are intentionally absent here.

server:
  address: 'tcp://:9091/'

log:
  level: 'info'
  format: 'text'

# jwt_secret comes from AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE.
# Present but effectively unused (password reset is disabled below); harmless.
identity_validation:
  reset_password:
    jwt_lifespan: '5 minutes'
    jwt_algorithm: 'HS256'

authentication_backend:
  password_reset:
    disable: true          # single admin, no SMTP; reset by re-hashing via the CLI
  file:
    path: '/config/users_database.yml'
    watch: false
    search:
      email: false
      case_insensitive: false
    password:
      algorithm: 'argon2'
      argon2:
        variant: 'argon2id'
        iterations: 3
        memory: 65536
        parallelism: 4
        key_length: 32
        salt_length: 16

# Default deny; allowed access requires full 2FA by an admin, on the manager host
# and on bot subdomains (<name>.<COOKIE_DOMAIN>) gated via Caddy forward_auth.
access_control:
  default_policy: 'deny'
  rules:
    - domain: '{{ env "PUBLIC_HOST" }}'
      policy: 'two_factor'
      subject:
        - 'group:admins'
    - domain: '*.{{ env "COOKIE_DOMAIN" }}'
      policy: 'two_factor'
      subject:
        - 'group:admins'

session:
  # session.secret comes from AUTHELIA_SESSION_SECRET_FILE.
  cookies:
    # COOKIE_DOMAIN must: (1) contain a dot and not be a public suffix, and (2) be the
    # registrable PARENT of BOTH PUBLIC_HOST and AUTHELIA_HOST (they must be subdomains
    # of it, or the browser won't share this cookie and login loops). sslip.io example:
    # COOKIE_DOMAIN=203-0-113-5.sslip.io with PUBLIC_HOST=bot.203-0-113-5.sslip.io and
    # AUTHELIA_HOST=auth.203-0-113-5.sslip.io (dots, not hyphens). Real domain: example.com.
    - domain: '{{ env "COOKIE_DOMAIN" }}'
      authelia_url: 'https://{{ env "AUTHELIA_HOST" }}'
      default_redirection_url: 'https://{{ env "PUBLIC_HOST" }}'
      name: 'authelia_session'
      same_site: 'lax'
      inactivity: '5m'
      expiration: '1h'
      remember_me: '1M'

regulation:
  modes:
    - 'user'
    - 'ip'
  max_retries: 3
  find_time: '2m'
  ban_time: '5m'

storage:
  # storage.encryption_key comes from AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE.
  local:
    path: '/data/db.sqlite3'

notifier:
  disable_startup_check: false
  filesystem:
    filename: '/data/notification.txt'   # the TOTP enrollment link is written here

totp:
  issuer: '{{ env "PUBLIC_HOST" }}'

name: discordbotmanager

services:
  discordbotmanager:
    image: ghcr.io/yundera/appshield:2.0.7
    container_name: discordbotmanager
    hostname: discordbotmanager
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    cpu_shares: 80
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:80/ | grep -qE '(200|301|302|403)'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    expose:
      - "80"
    user: "root"
    environment:
      # Login-form auth (AppShield credentials mode, the store-proven no-hash gate):
      # the gateway serves its own login page and issues a session cookie. USER must
      # stay a literal - $USER would substitute the deploy shell's user.
      USER: "admin"
      PASSWORD: $APP_DEFAULT_PASSWORD
      BACKEND_HOST: "discordbotmanagerapp-gate"
      BACKEND_PORT: "8080"
      LISTEN_PORT: "80"
      TZ: $TZ
    volumes:
      # Persists AppShield sessions across restarts/updates (SESSIONS_FILE default
      # /data/sessions.json); without it every recreate logs the admin out.
      - type: bind
        source: $DATA_ROOT/AppData/discordbotmanager/appshield
        target: /data
    labels:
      caddy_0: discordbotmanager-${APP_DOMAIN}
      caddy_0.import: gateway_tls
      caddy_0.reverse_proxy: "{{upstreams 80}}"
      caddy_1: discordbotmanager-${APP_PUBLIC_IP_DASH}.nip.io
      caddy_1.import: gateway_tls
      caddy_1.reverse_proxy: "{{upstreams 80}}"
      caddy_2: discordbotmanager-${APP_PUBLIC_IP_DASH}.sslip.io
      caddy_2.reverse_proxy: "{{upstreams 80}}"
    depends_on:
      - discordbotmanagerapp
    networks:
      - internal
      - pcs
      - terminal

  discordbotmanagerapp:
    image: ghcr.io/krizcold/docker-discord-bot-manager:latest
    container_name: discordbotmanagerapp
    restart: unless-stopped
    # The manager waits up to 120 s on SIGTERM for a running dump, restore or operation.
    stop_grace_period: 130s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    user: "root"
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      PORT: 8080
      MANAGER_GATE_NETWORK: discordbotmanager_internal
      # The local socket the terminal service's dbm connects to, and the user it runs as.
      MANAGER_SOCKET: /run/dbm/manager.sock
      MANAGER_SOCKET_OWNER: "1000:1000"

      # Platform variables
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      APP_DEFAULT_PASSWORD: $APP_DEFAULT_PASSWORD
      APP_DOMAIN: $APP_DOMAIN
      APP_PUBLIC_IP_DASH: $APP_PUBLIC_IP_DASH

      # REF variables
      REF_DOMAIN: $REF_DOMAIN
      REF_NET: $REF_NET
      REF_SCHEME: $REF_SCHEME
      REF_PORT: $REF_PORT
      REF_SEPARATOR: $REF_SEPARATOR
      REF_DEFAULT_PORT: $REF_DEFAULT_PORT

      # Data root
      DATA_ROOT: $DATA_ROOT
      # Host truth of the container's DATA_DIR (/data here), so docker-run bind
      # mounts computed by the manager resolve on the host daemon.
      HOST_DATA_DIR: $DATA_ROOT/AppData/discordbotmanager/data

      # SMTP variables
      SMTP_HOST: $SMTP_HOST
      SMTP_PORT: $SMTP_PORT
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: bind
        source: $DATA_ROOT/AppData/discordbotmanager/data/
        target: /data
      - type: bind
        source: $DATA_ROOT/AppData/
        target: /DATA/AppData/
      - type: volume
        source: manager_socket
        target: /run/dbm
    networks:
      internal:
        aliases:
          - discordbotmanagerapp-gate
      pcs: {}
    expose:
      - 8080

    cpu_shares: 50
    deploy:
      resources:
        limits:
          memory: 512M

    x-casaos:
      volumes:
        - container: /var/run/docker.sock
          description:
            en_us: Docker socket for container management.
        - container: /data
          description:
            en_us: Persistent data directory for bot configurations and registry.
        - container: /DATA/AppData
          description:
            en_us: CasaOS AppData directory for metadata placement and volume management.

  # The dbm terminal frame in a browser (ttyd). AppShield reaches it only when its
  # BACKEND_HOST names this service; it holds no Docker socket and no data folder.
  discordbotmanagerterminal:
    image: ghcr.io/krizcold/docker-discord-bot-manager:latest
    container_name: discordbotmanagerterminal
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    tmpfs:
      - /tmp:size=16m
    entrypoint: ["ttyd", "-W", "-O", "-m", "1", "-p", "8080", "node", "/app/dist/cli/dbm.js"]
    environment:
      DBM_SOCKET: /run/dbm/manager.sock
      DATA_DIR: /data
      HOST_DATA_DIR: $DATA_ROOT/AppData/discordbotmanager/data
      TZ: $TZ
    volumes:
      - type: volume
        source: manager_socket
        target: /run/dbm
        read_only: true
    networks:
      - terminal

    cpu_shares: 50
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  internal:
    name: discordbotmanager_internal
    driver: bridge
  terminal:
    name: discordbotmanager_terminal
    driver: bridge
    internal: true
  pcs:
    name: pcs
    external: true

volumes:
  manager_socket: {}

x-casaos:
  architectures:
    - amd64
    - arm64
  main: discordbotmanager
  author: kriz_cold
  developer: kriz_cold
  icon: https://cdn.jsdelivr.net/gh/krizcold/docker-discord-bot-manager/icon.png
  tagline:
    en_us: "Manage multiple Discord bots from GitHub repositories"
  category: Utilities
  description:
    en_us: "A Docker-based platform for managing Discord bots. Import bots from GitHub, configure environment variables, and manage deployments with automatic updates."
  title:
    en_us: "Discord Bot Manager"
  store_app_id: discordbotmanager
  is_uncontrolled: false
  index: /
  port_map: "80"
  webui_port: 80
